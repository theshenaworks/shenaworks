name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Test, Build & Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URI: postgresql://postgres:postgres@127.0.0.1:5432/shena_test
      DIRECT_DATABASE_URI: postgresql://postgres:postgres@127.0.0.1:5432/shena_test
      PAYLOAD_SECRET: ci-test-payload-secret-32-bytes-minimum
      ENQUIRY_TOKEN_SECRET: ci-test-enquiry-secret-32-bytes-minimum
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        env:
          PAYLOAD_MIGRATING: 'true'
        run: pnpm payload migrate

      - name: Seed test database
        run: pnpm seed

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build Next.js application
        run: pnpm build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E & WCAG 2.2 AA tests
        run: >-
          pnpm exec playwright test
          tests/e2e/site.spec.ts
          tests/e2e/ChromeAndA11y.spec.ts
          tests/e2e/EnquiryFlows.spec.ts
          tests/e2e/ProjectFilters.spec.ts
          tests/e2e/ReducedMotion.spec.ts
          tests/e2e/phase-c-behavior.spec.ts
          tests/e2e/phase-d-data.spec.ts

      - name: Visual parity check (advisory until reference baselines are refreshed)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pil
          pnpm exec playwright test tests/e2e/parity.spec.ts --retries=0
